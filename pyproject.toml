[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockfolio"
version = "0.1.0"
description = "股票仓位温度计：零依赖 Tkinter 持仓看板，行情/日线 + 可配置现金规则建议"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "stockfolio contributors" }]
keywords = ["stock", "portfolio", "tkinter", "sina", "valuation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[tool.setuptools]
packages = ["stockfolio"]
